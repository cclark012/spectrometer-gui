[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrometer-gui"
version = "0.1.0"
description = "PySide6 spectroscopy acquisition GUI for QEPro, Newport 2936-R, and Coherent OBIS laser boxes."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }

dependencies = [
  "numpy>=2.3,<3",
  "PySide6>=6.10,<6.11",
  "pyqtgraph>=0.14,<0.15",
  "pyserial>=3.5,<4",
  "seabreeze==2.11.0",
  "pythonnet>=3.1,<3.2",
]

[project.optional-dependencies]
opengl = [
  "PyOpenGL>=3.1",
]
dev = [
  "pytest>=8",
  "ruff>=0.11",
]

[tool.setuptools]
py-modules = ["gui"]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "controllers*",
  "core*",
  "devices*",
  "dialogs*",
  "io_utils*",
  "panels*",
  "planning*",
  "validation*",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
