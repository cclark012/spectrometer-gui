## 3. `pyproject.toml`

Now that `pythonnet 3.1.0` is released as stable and supports Python `<3.15, >=3.10`, you can stop depending on the release candidate in normal installs. PyPI currently lists `pythonnet 3.1.0` as stable, with CPython 3.14 wheels for Windows and Python 3.14 classifiers. :contentReference[oaicite:3]{index=3}

`seabreeze 2.11.0` supports Python 3.14 and lists QE-PRO support, and its install instructions still call out `seabreeze_os_setup`. :contentReference[oaicite:4]{index=4} PySide6 supports Python `<3.15, >=3.10`, and pyqtgraph 0.14.0 is current with Python `>=3.10`. :contentReference[oaicite:5]{index=5}

Use:

```toml
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrometer-gui"
version = "0.1.0"
description = "PySide6 spectroscopy acquisition GUI for QEPro, Newport 2936-R, and Coherent OBIS laser boxes."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }

dependencies = [
  "numpy>=2.3,<3",
  "PySide6>=6.10,<6.11",
  "pyqtgraph>=0.14,<0.15",
  "pyserial>=3.5,<4",
  "seabreeze==2.11.0",
  "pythonnet>=3.1,<3.2",
]

[project.optional-dependencies]
opengl = [
  "PyOpenGL>=3.1",
]
dev = [
  "pytest>=8",
  "ruff>=0.11",
]

[tool.setuptools]
py-modules = ["gui"]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "controllers*",
  "core*",
  "devices*",
  "dialogs*",
  "io_utils*",
  "panels*",
  "planning*",
  "validation*",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
